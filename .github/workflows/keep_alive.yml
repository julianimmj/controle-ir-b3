name: Manter Streamlit Ativo

on:
  schedule:
    # Executa a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit App
        run: |
          python - << 'EOF'
          import urllib.request

          urls = ['https://positionandtax.streamlit.app/']

          class NoRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirectHandler)

          for url in urls:
              print(f"Acessando: {url}")
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
                  resp = opener.open(req, timeout=30)
                  print(f" -> Sucesso (HTTP {resp.getcode()})")
              except urllib.error.HTTPError as e:
                  print(f" -> Sucesso (HTTP {e.code} - Wake-up enviado)")
              except Exception as e:
                  print(f" -> Aviso: {e}")

          print("Ping de atividade concluido com sucesso.")
          EOF